<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative AI</title><style>body{margin:0;background:#f3f0e9;color:#171716;font:16px system-ui;padding:32px}main{max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ccc;padding-bottom:20px}.logo{font-weight:900;font-size:24px}.logo b{background:#171716;color:#d7ff37;padding:3px 6px;border-radius:5px;font-size:13px;margin-left:3px}button{padding:8px 12px;border:1px solid #999;background:transparent;border-radius:6px;cursor:pointer}h1{font-size:clamp(38px,6vw,72px);letter-spacing:-3px;margin:70px 0 12px}p{color:#625f59;line-height:1.6}.meta{font-size:12px;color:#777}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:30px}.card{background:#fff;border:1px solid #ddd;padding:18px;text-decoration:none;color:inherit;min-height:170px}.tag{font-size:11px;background:#d7ff37;padding:4px 6px;border-radius:4px}.card h2{font-size:18px;line-height:1.25}.card small{color:#777}@media(max-width:600px){body{padding:18px}}</style><main><header><div class="logo">CREATIVE<b>AI</b></div><button id="lang">العربية</button></header><section><h1 id="title">Signals worth your attention.</h1><p id="intro">Trusted releases and open-source momentum from the AI world — always linked to the original source.</p><div class="meta" id="status">Loading trusted signals…</div><div class="grid" id="feed"></div></section></main><script>let ar=false;const el=x=>document.getElementById(x);function render(data){el('title').textContent=ar?'إشارات تستحق اهتمامك.':'Signals worth your attention.';el('intro').textContent=ar?'إصدارات موثوقة ومشاريع مفتوحة المصدر من عالم الذكاء الاصطناعي، مع رابط المصدر الأصلي دائمًا.':'Trusted releases and open-source momentum from the AI world — always linked to the original source.';el('lang').textContent=ar?'EN':'العربية';el('status').textContent=(ar?'آخر تحديث: ':'Last update: ')+(data.updatedAt?new Date(data.updatedAt).toLocaleString(): '—');el('feed').innerHTML=data.items.map(x=>`<a class="card" href="${x.url}" target="_blank" rel="noreferrer"><span class="tag">${x.kind}</span><h2>${x.title}</h2><small>${x.source} · ${x.publishedAt||''}</small></a>`).join('')||'<p>No signals yet. The monitor will refresh this feed automatically.</p>'}let data;fetch('data/updates.json').then(r=>r.json()).then(x=>{data=x;render(data)});el('lang').onclick=()=>{ar=!ar;document.documentElement.dir=ar?'rtl':'ltr';document.documentElement.lang=ar?'ar':'en';render(data)}</script>
