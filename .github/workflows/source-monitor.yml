name: Update Creative AI signals

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect review candidates
        run: python scripts/collect_updates.py
      - name: Commit fresh signals
        run: |
          git config user.name "Creative AI Review Monitor"
          git config user.email "creative-ai-monitor@users.noreply.github.com"
          git add data/updates.json
          git diff --cached --quiet || git commit -m "chore: refresh AI signals"
          git push
