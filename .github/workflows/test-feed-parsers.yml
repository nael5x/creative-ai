name: Test project suite

on:
  pull_request:
    paths:
      - "data/tools.json"
      - "data/tool-lifecycle.json"
      - "data/verified-facts.json"
      - "data/catalog-quality.json"
      - "*.html"
      - "styles/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "data/tools.json"
      - "data/tool-lifecycle.json"
      - "data/verified-facts.json"
      - "data/catalog-quality.json"
      - "*.html"
      - "styles/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run complete regression suite
        run: python -m pytest -q
