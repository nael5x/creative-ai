name: Build Creative AI React components

on:
  push:
    branches:
      - "**"
    paths:
      - "package.json"
      - "vite.config.js"
      - "scripts/components-entry.jsx"
      - "scripts/creative-ai-components.css"
      - "scripts/test-components.mjs"
      - "index.html"
      - "vendor/react-bits/**"

permissions:
  contents: write

concurrency:
  group: react-components-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install component dependencies
        run: npm install --no-audit --no-fund
      - name: Build isolated component bundle
        run: npm run build:components
      - name: Install Chromium for browser smoke test
        run: npx playwright install --with-deps chromium
      - name: Test homepage components in Chromium
        run: npm run test:components:browser
      - name: Copy static bundle into the Pages source tree
        run: |
          mkdir -p scripts
          find scripts -maxdepth 1 -type f -name 'components-entry-*.js' -delete
          find scripts -maxdepth 1 -type f -name 'SideRays-*.js' -delete
          find scripts -maxdepth 1 -type f -name 'Antigravity-*.js' -delete
          find scripts -maxdepth 1 -type f -name 'MagicBento-*.js' -delete
          find scripts -maxdepth 1 -type f -name 'GradientText-*.js' -delete
          find scripts -maxdepth 1 -type f -name 'SpotlightCard-*.js' -delete
          find scripts -maxdepth 1 -type f -name 'LogoLoop-*.js' -delete
          find scripts -maxdepth 1 -type f -name 'AnimatedContent-*.js' -delete
          find scripts -maxdepth 1 -type f -name 'PillNav-*.js' -delete
          find scripts -maxdepth 1 -type f -name 'ChromaGrid-*.js' -delete
          find scripts -maxdepth 1 -type f -name 'CountUp-*.js' -delete
          cp dist/*.js scripts/
          cp dist/creative-ai-components.css creative-ai-components.css
      - name: Commit static bundle for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/ creative-ai-components.css
          if git diff --cached --quiet; then
            echo "Component bundle is already up to date."
            exit 0
          fi
          git commit -m "build: compile Creative AI React components [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
