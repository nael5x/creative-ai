name: Audit catalog links

on:
  schedule:
    - cron: "15 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "data/tools.json"
      - "scripts/audit_catalog_links.py"
      - ".github/workflows/catalog-link-audit.yml"
      - "data/catalog-quality.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit canonical tool URLs
        run: python scripts/audit_catalog_links.py --workers 24 --timeout 12 --output catalog-link-audit.json
      - name: Show review candidates
        run: |
          python - <<'PY'
          import json
          report = json.load(open("catalog-link-audit.json", encoding="utf-8"))
          print(json.dumps(report["summary"], indent=2))
          for item in report["results"]:
              if item["flags"] or not item["ok"]:
                  print(f"CHECK\t{item['name']}\t{item['status']}\t{item['final_url']}\t{','.join(item['flags'])}\t{item['error'] or ''}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-link-audit
          path: catalog-link-audit.json
          if-no-files-found: error
          retention-days: 14
